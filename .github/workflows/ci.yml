name: Vocabulary candidate validation
on:
  push:
    branches: ['codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:server
      - run: python3 -m unittest discover -s scripts/release -p test_pack_app.py
      - run: python3 -m unittest discover -s ops/deploy -p test_vocabulary_runtime.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Select isolated browser executable
        run: node --input-type=module -e "import {chromium} from 'playwright'; console.log('CHROME_PATH='+chromium.executablePath())" >> "$GITHUB_ENV"
      - run: node scripts/test-spelling-e2e.mjs
      - run: node scripts/test-daily-quantity-e2e.mjs
      - run: node scripts/test-recall-e2e.mjs
      - run: npm run test:sync
