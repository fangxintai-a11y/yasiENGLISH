# Existing Tencent site: retain its certificate, host, ports and API service.
server {
    listen 80;
    listen [::]:80;
    server_name www.i2023.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/yasi/acme;
        try_files $uri =404;
    }
    location / { return 301 https://www.i2023.com$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.i2023.com;
    ssl_certificate /etc/letsencrypt/live/www.i2023.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.i2023.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:YasiTLS:10m;
    ssl_session_timeout 1d;
    root /var/www/yasi/current;
    index index.html;
    access_log /var/log/nginx/yasi-access.log;
    error_log /var/log/nginx/yasi-error.log warn;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    auth_request /_band_auth;
    location = /_band_auth {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:5189/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /login {
        auth_request off;
        proxy_pass http://127.0.0.1:5189;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /api/ {
        auth_request off;
        proxy_pass http://127.0.0.1:5189;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 8m;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /private/ {
        alias /opt/yasi/private/;
        disable_symlinks on;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # A stale local-bank URL must not fall through to SPA HTML or expose a bank.
    location ^~ /local-bank/ { return 404; }
    location = / {
        error_page 401 = @band_login;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location @band_login { return 302 /login; }
    location /assets/ {
        add_header Cache-Control "private, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri =404;
    }
    location ~ ^/(atlas/(img|thumb|audio)|brand|sfx)/ {
        add_header Cache-Control "private, max-age=2592000";
        try_files $uri =404;
    }
    location ~ (^|/)\. { deny all; }
    location ~ ^/(atlas|ielts|offline|brand|sfx|curriculum365)/ {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
